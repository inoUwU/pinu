# https://taskfile.dev
# Unix/Linux/macOS用Taskfile

version: "3"

vars:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  BIN_DIR: bin

tasks:
  # デフォルトタスク
  default:
    desc: 利用可能なタスクを一覧表示
    cmds:
      - task --list
    silent: true

  # Task ランナーのインストール
  install:task:
    desc: Task ランナーをインストール
    cmds:
      - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
    status:
      - command -v task

  # 初期セットアップ
  setup:
    desc: 環境変数と依存関係をセットアップ
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "📝 .envファイルを作成中..."
          cp .env.example .env
          echo "✅ .envファイルが作成されました"
        else
          echo "✅ .envファイルは既に存在します"
        fi
      - echo "🐳 Docker Composeサービスを起動中..."
      - docker compose up -d postgres air
      - echo "⏳ サービスの起動を待機中..."
      - sleep 5
      - echo "📦 バックエンドの依存関係をインストール中..."
      - task: backend:deps
      - echo "📦 フロントエンドの依存関係をインストール中..."
      - task: frontend:deps
      - echo "✨ セットアップが完了しました！"

  # 開発環境の起動
  start:
    desc: 開発環境を起動（DB + バックエンド + フロントエンド）
    deps: [db:start]
    cmds:
      - echo "🚀 開発環境を起動中..."
      - |
        (cd {{.BACKEND_DIR}} && go run app/cmd/main.go) &
        BACKEND_PID=$!
        echo $BACKEND_PID > /tmp/pinu_backend.pid
      - |
        (cd {{.FRONTEND_DIR}} && pnpm dev) &
        FRONTEND_PID=$!
        echo $FRONTEND_PID > /tmp/pinu_frontend.pid
      - echo "✨ 開発環境が起動しました！"
      - echo "⚡ バックエンド - http://localhost:8000"
      - echo "🚀 フロントエンド - http://localhost:3000"
      - echo "🐘 データベース - localhost:5432"
      - echo ""
      - echo "停止するには - task stop"

  # 開発環境一式（adminer含む）
  dev:
    desc: 開発環境一式起動（Docker全サービス）
    cmds:
      - docker compose up -d
      - echo "✨ 開発環境が起動しました！"
      - echo "📊 Adminer - http://localhost:8080"
      - echo "⚡ バックエンド - http://localhost:8000 (Docker内)"
      - echo "🚀 フロントエンド - task frontend:dev で起動してください"
      - echo ""
      - echo "停止するには - task stop"

  # 開発環境の停止
  stop:
    desc: 開発環境を停止
    cmds:
      - echo "🛑 開発環境を停止中..."
      - docker compose stop
      - |
        if [ -f /tmp/pinu_backend.pid ]; then
          kill $(cat /tmp/pinu_backend.pid) 2>/dev/null || true
          rm /tmp/pinu_backend.pid
        fi
      - |
        if [ -f /tmp/pinu_frontend.pid ]; then
          kill $(cat /tmp/pinu_frontend.pid) 2>/dev/null || true
          rm /tmp/pinu_frontend.pid
        fi
      - pkill -f "go run app/cmd/main.go" || true
      - pkill -f "pnpm dev" || true
      - echo "✅ 開発環境が停止されました"

  # 完全クリーンアップ
  clean:
    desc: データベースを含めて完全に削除
    cmds:
      - echo "🧹 クリーンアップ中..."
      - task: stop
      - docker compose down -v
      - docker system prune -f
      - echo "✅ クリーンアップが完了しました"

  # 完全リセット
  fresh:
    desc: 完全に新しい状態で環境を起動
    cmds:
      - echo "🔄 環境を完全リセット中..."
      - task: clean
      - task: setup
      - task: start

  # ==================== データベース関連 ====================

  db:start:
    desc: PostgreSQLを起動
    cmds:
      - docker compose up -d postgres
      - echo "🐘 PostgreSQL started at localhost - 5432"

  db:stop:
    desc: PostgreSQLを停止
    cmds:
      - docker compose stop postgres
      - echo "🛑 PostgreSQL stopped"

  db:reset:
    desc: データベースをリセット（全データ削除）
    cmds:
      - echo "⚠️  データベースをリセット中..."
      - docker compose down postgres -v
      - docker compose up -d postgres
      - echo "⏳ PostgreSQLの起動を待機中..."
      - sleep 5
      - echo "🔄 Database reset completed"

  db:logs:
    desc: PostgreSQLのログを表示
    cmds:
      - docker compose logs -f postgres

  # ==================== バックエンド関連 ====================

  backend:deps:
    desc: バックエンドの依存関係をインストール
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go mod tidy
      - go mod download
      - echo "✅ バックエンドの依存関係がインストールされました"

  backend:dev:
    desc: バックエンドを開発モードで起動
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go run app/cmd/main.go
    env:
      GO_ENV: development

  backend:build:
    desc: バックエンドをビルド
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - mkdir -p ../{{.BIN_DIR}}
      - go build -o ../{{.BIN_DIR}}/backend app/cmd/main.go
      - echo '✅ バックエンドがビルドされました:' {{.BIN_DIR}}/backend

  backend:test:
    desc: バックエンドのテストを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go test ./... -v

  backend:smoke:
    desc: バックエンドAPIスモークテストを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - SMOKE_BASE_URL={{default "http://localhost:8000" .SMOKE_BASE_URL}} go test ./... -run TestAPISmoke -v

  backend:lint:
    desc: バックエンドのLintを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run
        else
          echo "⚠️  golangci-lint がインストールされていません"
          echo "インストール: https://golangci-lint.run/usage/install/"
        fi

  # ==================== フロントエンド関連 ====================

  frontend:deps:
    desc: フロントエンドの依存関係をインストール
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm install
      - echo "✅ フロントエンドの依存関係がインストールされました"

  frontend:dev:
    desc: フロントエンドを開発モードで起動
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev

  frontend:build:
    desc: フロントエンドをビルド
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build
      - echo "✅ フロントエンドがビルドされました"

  frontend:test:
    desc: フロントエンドのテストを実行
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm test

  frontend:lint:
    desc: フロントエンドのLintを実行
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm lint

  frontend:format:
    desc: フロントエンドのフォーマットを実行
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm format

  # ==================== 統合タスク ====================

  test:
    desc: 全体のテストを実行
    cmds:
      - echo "🧪 全体のテストを実行中..."
      - task: backend:test
      - task: frontend:test
      - echo "✅ 全テスト完了"

  lint:
    desc: 全体のLintを実行
    cmds:
      - echo "🔍 全体のLintを実行中..."
      - task: backend:lint
      - task: frontend:lint
      - echo "✅ 全Lint完了"

  build:
    desc: 全体をビルド
    cmds:
      - echo "🔨 全体をビルド中..."
      - task: backend:build
      - task: frontend:build
      - echo "✅ 全ビルド完了"

  deploy:prep:
    desc: デプロイ準備（ビルド + テスト）
    cmds:
      - echo "📦 デプロイ準備中..."
      - task: build
      - task: test
      - echo "✅ デプロイ準備完了"

  # ==================== ログ関連 ====================

  logs:
    desc: 全サービスのログを表示
    cmds:
      - docker compose logs -f

  logs:backend:
    desc: バックエンドのログを表示
    cmds:
      - docker compose logs -f air
